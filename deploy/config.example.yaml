# efBlock : configuration d'exemple. Copie ce fichier en config.yaml.

dns:
  # Adresse d'écoute (UDP + TCP). En dev on utilise 5353 (port non privilégié).
  # En production : ":53".
  listen: "127.0.0.1:5353"

  # Résolveurs amont, essayés dans l'ordre (le suivant prend le relais en cas d'échec).
  #   "tls://1.1.1.1"                         DoT : chiffré, port 853
  #   "https://cloudflare-dns.com/dns-query"  DoH : chiffré, port 443 (passe presque partout)
  #   "1.1.1.1"                               DNS classique, NON chiffré
  # Si le port 853 est bloqué (réseau d'école...), utilise les lignes https://.
  upstreams:
    - "tls://1.1.1.1"
    - "tls://9.9.9.9"
    # - "https://cloudflare-dns.com/dns-query"
    # - "https://dns.quad9.net/dns-query"
    # - "1.1.1.1"      # secours en clair (désactivé : un blocage du chiffré ne doit pas te faire fuiter)

  # DNS classiques servant UNIQUEMENT à trouver l'IP d'un upstream donné par un nom
  # (cloudflare-dns.com...). Inutile si tes upstreams sont donnés par IP.
  bootstrap: ["1.1.1.1:53", "9.9.9.9:53"]

  # Délai max d'attente d'une réponse amont.
  timeout: 3s

  # Qui a le droit d'utiliser ce DNS. Sans cette ligne : seulement les réseaux privés
  # (10.x, 172.16-31.x, 192.168.x, boucle locale). Ne mets jamais 0.0.0.0/0 : ton serveur
  # deviendrait un "résolveur ouvert", détournable pour attaquer des tiers.
  # allowed_clients: ["192.168.1.0/24"]

  # Noms du réseau local. Sans ça, "nas.maison" ou la recherche inverse d'une IP privée
  # partent sur internet (échec, et fuite d'informations sur ton réseau). Les zones
  # inverses privées sont de toute façon traitées localement, même sans cette section.
  # local:
  #   upstream: "192.168.1.1"        # le résolveur qui connaît les noms du LAN (ta box)
  #   domains: ["lan", "maison"]     # suffixes envoyés à ce résolveur, jamais à internet
  #   hosts:                         # noms fixes, format /etc/hosts
  #     - "192.168.1.20 nas.maison nas"
  #     - "192.168.1.1 box.maison"

filter:
  # Dossier où sont gardées les listes téléchargées (le serveur démarre ainsi
  # avec les listes du dernier téléchargement, même sans internet).
  data_dir: "./data"

  # zero_ip : répond 0.0.0.0 / :: (échec immédiat côté appli, mode par défaut)
  # nxdomain : répond "ce domaine n'existe pas"
  block_mode: zero_ip

  # À quelle fréquence retélécharger les listes.
  update_interval: 24h

  # Formats acceptés : hosts, adblock simple (||domaine^), un domaine par ligne.
  # "url" peut aussi être un chemin de fichier local.
  lists:
    - name: StevenBlack
      url: https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts
    - name: OISD small
      url: https://small.oisd.nl/

  # Vérifier aussi les alias (CNAME) des réponses : un traqueur caché derrière un nom
  # innocent est bloqué. Désactive seulement si un site légitime est cassé par cette vérification.
  # cname_check: true

  # Empêcher le contournement d'efBlock : le domaine témoin de Firefox, iCloud Private Relay et les
  # serveurs DNS chiffrés connus (dns.google, cloudflare-dns.com...) reçoivent « n'existe pas ».
  # Les appareils reviennent alors au DNS du réseau. Désactive si tu veux laisser un appareil les utiliser
  # (ou autorise seulement le domaine voulu dans l'allowlist).
  # block_bypass: true

  # Jamais bloqués (sous-domaines inclus). Prioritaire sur tout.
  allowlist: []
  # Toujours bloqués (sous-domaines inclus).
  blocklist: []

cache:
  # Mettre "enabled: false" pour désactiver (utile pour déboguer).
  enabled: true
  # Nombre max de réponses gardées en mémoire (~1 Ko chacune).
  max_entries: 10000
  # Plafond de durée de vie, même si l'upstream annonce un TTL plus long.
  max_ttl: 24h
  # Si aucun upstream ne répond, servir une ancienne réponse (jusqu'à cet âge) plutôt
  # que d'échouer : un site déjà visité reste joignable pendant une panne.
  # serve_stale: true
  # stale_max: 24h
  # Rafraîchir en avance les réponses très demandées, juste avant leur expiration.
  # prefetch: true

querylog:
  # Journal des requêtes (domaine, client, bloqué ou non), dans une base SQLite.
  # Il alimente le tableau de bord. "enabled: false" = aucune requête enregistrée (vie privée).
  enabled: true
  # path: "./data/queries.db"
  # Durée de conservation en jours (-1 = illimité).
  retention_days: 7

web:
  # Interface d'administration. Désactivée tant que password_hash est vide.
  # Génère le hash avec :  ./efblock -hash-password
  # IMPORTANT : mets le hash entre guillemets simples (il contient des $).
  password_hash: ""
  # Adresse d'écoute. Mets l'IP de la VM pour ne pas écouter sur les autres cartes.
  listen: "0.0.0.0:8080"
  # Seuls ces réseaux peuvent ouvrir l'interface (par défaut : tous les réseaux privés).
  # Sur un wifi partagé, RESTREINS-LE à ton PC, ex: ["192.168.1.50/32"].
  # allowed_cidrs: ["192.168.1.50/32"]
  # HTTPS (recommandé si d'autres personnes sont sur le réseau) :
  # tls_cert: "./data/cert.pem"
  # tls_key: "./data/key.pem"

# Les groupes de clients (règles par appareil) se gèrent depuis la page "Groupes" de l'interface.
# Presque tout le reste peut aussi se régler depuis l'interface web (page "Réglages"), sans
# redémarrer. Ces réglages sont enregistrés dans data/settings.json et remplacent
# ceux de ce fichier pour le groupe modifié. Restent ici : les adresses d'écoute
# (dns.listen, web.listen), HTTPS, le dossier de données et le hash initial du mot de passe.

# efBlock : configuration d'exemple. Copie ce fichier en config.yaml.

dns:
  # Adresse d'écoute (UDP + TCP). En dev on utilise 5353 (port non privilégié).
  # En production : ":53".
  listen: "127.0.0.1:5353"

  # Résolveurs amont, essayés dans l'ordre (le suivant prend le relais en cas d'échec).
  #   "tls://1.1.1.1"                         DoT : chiffré, port 853
  #   "https://cloudflare-dns.com/dns-query"  DoH : chiffré, port 443 (passe presque partout)
  #   "1.1.1.1"                               DNS classique, NON chiffré
  # Si le port 853 est bloqué (réseau d'école...), utilise les lignes https://.
  upstreams:
    - "tls://1.1.1.1"
    - "tls://9.9.9.9"
    # - "https://cloudflare-dns.com/dns-query"
    # - "https://dns.quad9.net/dns-query"
    # - "1.1.1.1"      # secours en clair (désactivé : un blocage du chiffré ne doit pas te faire fuiter)

  # DNS classiques servant UNIQUEMENT à trouver l'IP d'un upstream donné par un nom
  # (cloudflare-dns.com...). Inutile si tes upstreams sont donnés par IP.
  bootstrap: ["1.1.1.1:53", "9.9.9.9:53"]

  # Délai max d'attente d'une réponse amont.
  timeout: 3s

filter:
  # Dossier où sont gardées les listes téléchargées (le serveur démarre ainsi
  # avec les listes du dernier téléchargement, même sans internet).
  data_dir: "./data"

  # zero_ip : répond 0.0.0.0 / :: (échec immédiat côté appli, mode par défaut)
  # nxdomain : répond "ce domaine n'existe pas"
  block_mode: zero_ip

  # À quelle fréquence retélécharger les listes.
  update_interval: 24h

  # Formats acceptés : hosts, adblock simple (||domaine^), un domaine par ligne.
  # "url" peut aussi être un chemin de fichier local.
  lists:
    - name: StevenBlack
      url: https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts
    - name: OISD small
      url: https://small.oisd.nl/

  # Jamais bloqués (sous-domaines inclus). Prioritaire sur tout.
  allowlist: []
  # Toujours bloqués (sous-domaines inclus).
  blocklist: []

cache:
  # Mettre "enabled: false" pour désactiver (utile pour déboguer).
  enabled: true
  # Nombre max de réponses gardées en mémoire (~1 Ko chacune).
  max_entries: 10000
  # Plafond de durée de vie, même si l'upstream annonce un TTL plus long.
  max_ttl: 24h

querylog:
  # Journal des requêtes (domaine, client, bloqué ou non), dans une base SQLite.
  # Il alimente le tableau de bord. "enabled: false" = aucune requête enregistrée (vie privée).
  enabled: true
  # path: "./data/queries.db"
  # Durée de conservation en jours (-1 = illimité).
  retention_days: 7

# Menu de démarrage UEFI d'efBlock. Il attend un choix : rien n'est effacé sans que tu le demandes.
set default=0
set timeout=-1

if loadfont /boot/grub/font.pf2 ; then
    set gfxmode=auto
    insmod all_video
    insmod gfxterm
    terminal_output gfxterm
fi

menuentry 'Installer efBlock (EFFACE LE PREMIER DISQUE)' {
    linux /install.amd/vmlinuz auto=true priority=critical preseed/file=/cdrom/efblock/preseed-auto.cfg vga=788 --- quiet
    initrd /install.amd/initrd.gz
}
menuentry 'Installation guidee (je choisis le disque)' {
    linux /install.amd/vmlinuz auto=true priority=critical preseed/file=/cdrom/efblock/preseed-guided.cfg vga=788 --- quiet
    initrd /install.amd/initrd.gz
}

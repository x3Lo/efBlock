# Menu de démarrage UEFI d'efBlock : une seule entrée, rien n'est effacé tant qu'on ne la choisit pas.
set default=0
set timeout=-1

if loadfont /boot/grub/font.pf2 ; then
    set gfxmode=auto
    insmod all_video
    insmod gfxterm
    terminal_output gfxterm
fi

set menu_color_normal=white/black
set menu_color_highlight=black/light-cyan

menuentry 'Installer efBlock  (efface le disque)' {
    linux /install.amd/vmlinuz auto=true priority=high preseed/file=/cdrom/efblock/preseed-auto.cfg vga=788 --- quiet
    initrd /install.amd/initrd.gz
}

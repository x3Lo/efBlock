# efBlock : réponses automatiques de l'installateur Debian (partie commune).
# Tout ce que l'installateur demanderait habituellement est répondu ici : il ne reste
# que le choix du disque (selon l'entrée du menu de démarrage).

# --- Langue, pays, clavier : demandés pendant l'installation ---
# On ne répond volontairement PAS à ces questions (ni locale, ni clavier, ni fuseau horaire) :
# l'installateur les pose, comme dans une installation Debian normale. Pour la France, choisir
# « Français », le pays « France », puis le clavier « Français » (AZERTY). Le fuseau horaire
# se déduit du pays. Les menus de démarrage lancent l'installateur avec « priority=high »,
# ce qui fait afficher ces questions, alors que tout le reste est répondu ci-dessous.
d-i console-setup/ask_detect boolean false
d-i clock-setup/utc boolean true
d-i clock-setup/ntp boolean true

# --- Réseau pendant l'installation (DHCP) ---
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string efblock
d-i netcfg/get_domain string local
d-i netcfg/hostname string efblock
d-i netcfg/wireless_wep string

# Pas de micrologiciels propriétaires à demander (inutiles sous VMware ; évite une question).
d-i hw-detect/load_firmware boolean false

# --- Source des paquets Debian ---
d-i mirror/country string manual
d-i mirror/protocol string https
d-i mirror/https/hostname string deb.debian.org
d-i mirror/https/directory string /debian
d-i mirror/https/proxy string
d-i apt-setup/use_mirror boolean true
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/cdrom/set-first boolean false

# --- Comptes : aucun mot de passe connu d'avance ---
# Le compte root est créé SANS mot de passe utilisable ("!" = verrouillé). Aucun autre
# compte n'est créé. Le mot de passe de l'interface web se choisit au premier démarrage,
# dans le menu de la console. Le shell root demande d'en choisir un au premier usage.
d-i passwd/root-login boolean true
d-i passwd/root-password-crypted password !
d-i passwd/make-user boolean false

# --- Paquets : système minimal, rien d'autre que le nécessaire ---
tasksel tasksel/first multiselect
d-i pkgsel/include string ca-certificates systemd-timesyncd bind9-dnsutils iproute2 iputils-ping less nano curl locales console-setup
d-i pkgsel/upgrade select none
d-i pkgsel/update-policy select none
d-i pkgsel/updatedb boolean false
popularity-contest popularity-contest/participate boolean false

# --- Chargeur de démarrage ---
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean false

# --- efBlock : installé en fin d'installation par un script du support ---
d-i preseed/late_command string sh /cdrom/efblock/late.sh

# --- Fin ---
d-i cdrom-detect/eject boolean true
d-i finish-install/reboot_in_progress note

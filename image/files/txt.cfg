label install
	menu label ^Installer efBlock (EFFACE LE PREMIER DISQUE)
	menu default
	kernel /install.amd/vmlinuz
	append auto=true priority=critical preseed/file=/cdrom/efblock/preseed-auto.cfg vga=788 initrd=/install.amd/initrd.gz --- quiet
label guided
	menu label Installation ^guidee (je choisis le disque)
	kernel /install.amd/vmlinuz
	append auto=true priority=critical preseed/file=/cdrom/efblock/preseed-guided.cfg vga=788 initrd=/install.amd/initrd.gz --- quiet

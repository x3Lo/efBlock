label install
	menu label ^Installer efBlock (EFFACE LE PREMIER DISQUE)
	menu default
	kernel /install.amd/vmlinuz
	append auto=true priority=high preseed/file=/cdrom/efblock/preseed-auto.cfg vga=788 initrd=/install.amd/initrd.gz --- quiet
label guided
	menu label Installation ^guidee (je choisis le disque)
	kernel /install.amd/vmlinuz
	append auto=true priority=high preseed/file=/cdrom/efblock/preseed-guided.cfg vga=788 initrd=/install.amd/initrd.gz --- quiet
label installssh
	menu label Installer efBlock + serveur ^SSH (EFFACE LE PREMIER DISQUE)
	kernel /install.amd/vmlinuz
	append auto=true priority=high preseed/file=/cdrom/efblock/preseed-auto.cfg efblock-ssh=1 vga=788 initrd=/install.amd/initrd.gz --- quiet
label guidedssh
	menu label Installation guidee + serveur S^SH (je choisis le disque)
	kernel /install.amd/vmlinuz
	append auto=true priority=high preseed/file=/cdrom/efblock/preseed-guided.cfg efblock-ssh=1 vga=788 initrd=/install.amd/initrd.gz --- quiet

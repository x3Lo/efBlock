name: Release

# Publie les paquets Debian et l'ISO d'installation quand tu crées une version :
#     git tag v1.0.0 && git push origin v1.0.0
# Tout apparaît dans l'onglet « Releases » du dépôt, avec le fichier SHA256SUMS que la
# console d'efBlock utilise pour vérifier les mises à jour.

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # lancement manuel : construit sans publier (fichiers téléchargeables 7 jours)

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Le tag doit être sur main (production)
        if: github.ref_type == 'tag'
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Le tag $GITHUB_REF_NAME n'est pas sur main : on ne publie que ce qui est en production. Fusionne dev dans main d'abord."
            exit 1
          fi
      - name: Outils
        run: sudo apt-get update && sudo apt-get install -y xorriso
      - name: Tests
        run: go test ./...
      - name: Version
        id: v
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0+ci${GITHUB_RUN_NUMBER}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Paquets Debian (amd64 et arm64)
        run: |
          packaging/build-deb.sh "${{ steps.v.outputs.version }}" amd64
          packaging/build-deb.sh "${{ steps.v.outputs.version }}" arm64
      - name: ISO d'installation
        run: image/build.sh "${{ steps.v.outputs.version }}"
      - name: Contrôle de l'ISO (démarrage et contenu)
        run: |
          iso="$(ls dist/efblock-*.iso)"
          report="$(xorriso -indev "$iso" -report_el_torito plain -report_system_area plain 2>&1 || true)"
          files="$(xorriso -indev "$iso" -find /efblock -type f 2>/dev/null | tr -d "'" | sort)"
          # %0A = retour à la ligne dans une annotation : le rapport reste lisible dans la page de l'exécution.
          esc() { sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g'; }
          boot="$(printf '%s\n' "$report" | grep -E 'El Torito|System area|GPT|MBR' | head -25 | esc)"
          list="$(printf '%s\n' "$files" | esc)"
          echo "::notice title=Contenu de l'ISO::Taille : $(du -h "$iso" | cut -f1)%0A%0A${boot}%0A%0AFichiers efBlock :%0A${list}"
          ok=1
          printf '%s' "$report" | grep -Ei 'El Torito boot img.*BIOS' >/dev/null || { echo "::error::pas d'entrée de démarrage BIOS dans l'ISO"; ok=0; }
          printf '%s' "$report" | grep -Ei 'El Torito boot img.*UEFI' >/dev/null || { echo "::error::pas d'entrée de démarrage UEFI dans l'ISO"; ok=0; }
          for f in preseed-auto.cfg preseed-guided.cfg late.sh; do
            printf '%s' "$files" | grep -q "/efblock/$f" || { echo "::error::$f absent de l'ISO"; ok=0; }
          done
          printf '%s' "$files" | grep -Eq '/efblock/efblock_.*_amd64\.deb' || { echo "::error::paquet efBlock absent de l'ISO"; ok=0; }
          [ "$ok" = 1 ]
      - name: Empreintes
        run: cd dist && sha256sum efblock_*.deb efblock-*.iso > SHA256SUMS && cat SHA256SUMS
      - name: Publier la version
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Une version 0.x est une pré-version : l'ISO n'a pas encore été éprouvée sur beaucoup de machines.
          flags=""
          if [[ "${{ steps.v.outputs.version }}" == 0.* ]]; then flags="--prerelease"; fi
          files="dist/efblock_*.deb dist/efblock-*.iso dist/SHA256SUMS"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # La version a déjà été créée à la main sur GitHub : on y ajoute les fichiers.
            gh release upload "$GITHUB_REF_NAME" $files --clobber
          else
            gh release create "$GITHUB_REF_NAME" $files \
              --title "efBlock $GITHUB_REF_NAME" --generate-notes $flags
          fi
      - name: Garder les fichiers (lancement manuel)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: efblock-${{ steps.v.outputs.version }}
          path: |
            dist/efblock_*.deb
            dist/efblock-*.iso
            dist/SHA256SUMS
          retention-days: 7
